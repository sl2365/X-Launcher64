PURPOSE OF THIS FILE
--------------------
This is the working defect list for repairing X-Launcher. The intention is to
fix ONE issue at a time, make the smallest reliable change, compile, run a
purpose-built test, and only then move to the next issue.

The list below includes the issues found during the static source audit. It also
distinguishes:
  [AUTOIT]  Behaviour changed because AutoIt itself changed.
  [X64/WIN] 32/64-bit Windows, WOW64, UAC, or modern Windows behaviour.
  [LATENT]  A logic/safety defect already present in the old source.
  [JAVA]    Obsolete Java ecosystem/install behaviour.
  [MIXED]   More than one of the above.

IMPORTANT CORRECTIONS TO THE FIRST REVIEW
-----------------------------------------
The source ZIP is internally complete. The expected files\ and graphics\
resources are present, so the earlier suggestion that the project could not
compile because those resources were missing was incorrect.

The SendMessageTimeout DllCall is not ideally typed for x64, but in this
specific use the pointer-sized message values are zero and the return value is
