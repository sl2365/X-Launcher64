======================================================================
; RECOMMENDED REPAIR ORDER
======================================================================

PHASE 0 — ESTABLISH THE TEST BASELINE
-------------------------------------
Before changing behaviour:
1. Standardise on the chosen AutoIt release.
2. Compile the untouched source and retain that executable as a baseline.
3. Create an isolated Tests folder and batch-driven test harness.
4. Record the AutoIt version, x86/x64 compile mode, test INI, launcher log,
   test payload log and PASS/FAIL result for every test.
5. Never use real application registry keys or valuable folders for destructive
   tests. Use dedicated test paths and HKCU\Software\XLauncher_Test only.

Recommended test layout:

Tests\
  01_Exit_Handler\
    RUN_TEST.bat
    test.ini
    payload.bat
    expected.txt
    Results\
  02_Launch_Failure\
  03_Process_Tracking\
  04_Registry_Export_Failure\
  ...

X-Launcher already supports:
  --x-launcher-config=<path-to-test-ini>

That makes isolated per-test INI files practical without modifying the user's
normal application INIs.

For most tests, payload.bat can:
- write timestamps and arguments to a log;
- create/delete marker files;
- inspect environment variables;
- return a deliberate ERRORLEVEL;
- use REG.EXE against a harmless HKCU test key;
- create test folders/files;
- sleep for controlled periods.

A small purpose-built test EXE will still be useful for process/PID tests.
A .BAT file runs inside cmd.exe, so using only batch files would not accurately
test all process-tracking behaviour.


BUILD METADATA NOTE — ProductVersion is intentionally descriptive
Origin: [ACCEPTED BUILD BEHAVIOUR]
Status: ACCEPTED — not counted as an X-Launcher defect.

The source intentionally uses:
    #AutoIt3Wrapper_Res_ProductVersion=ISN Studio v1.16 / AutoIT v3.3.18.0

AutoIt3Wrapper warns because the fixed numeric PRODUCTVERSION part of a Windows
VERSIONINFO resource expects a numeric version. The wrapper normalises that
numeric value, while the ProductVersion string displayed by Windows Explorer
can still contain the descriptive text. The supplied EXE Properties screenshot
confirms that Explorer displays the intended descriptive Product version.

The source also already contains:
    #AutoIt3Wrapper_Res_Comment=X-Launcher allows you to apply options to run programs to make them portable.

AutoIt3Wrapper officially supports this Comment resource field, but Windows
Explorer does not normally expose an EXE VERSIONINFO Comments entry on its
standard Properties -> Details page. Therefore moving the AutoIt build
information to Comments would make it less visible to ordinary users.

Project decision:
- keep the descriptive ProductVersion arrangement unless a fully verified,
  warning-free alternative is found that remains visible in standard Windows
  Explorer Properties;
- the compiler warning is accepted as a build-metadata warning, not a runtime
  defect;
- do not include this item in the functional repair count.

======================================================================
; PHASE 1 — APPLICATION LIFECYCLE AND CLEANUP
; Fix these first because all later portability cleanup depends on them.
======================================================================
[ISSUE 1 — CRITICAL]
— Exit handler is obsolete in modern AutoIt
Origin: [AUTOIT]
Current source defines:
    Func OnAutoItExit()
Modern AutoIt removed automatic OnAutoItExit() handling in v3.3.4.0.
The function must be registered with OnAutoItExitRegister().
Impact:
- shutdown/logoff cleanup may never execute;
- registry restoration and other cleanup may be skipped during Windows exit.
Recommended fix:
- register the exit callback explicitly;
- guard against cleanup being executed twice;
- test normal exit, launcher Exit(), Windows logoff/shutdown-style exit where
  practical, and forced termination separately.

[ISSUE 11 — HIGH]
— Application launch failures can be silent
Origin: [LATENT]
_Run() discards Run()/RunWait() return information and does not propagate
@error. The launcher marks IsRunning=true before the program is confirmed to
have started.
Impact:
- cleanup/status logic can proceed as though the target started successfully.
Recommended fix:
- return PID/exit status and @error from _Run();
- do not set running state until launch succeeds;
- log an explicit launch failure.

[ISSUE 9 — HIGH]
— Process tracking is by EXE filename, not launched PID
Origin: [LATENT]
The launcher waits on ProcessExists($ExeName), and the exit code can close by
process name.
Impact:
- an unrelated program with the same executable name can be mistaken for the
  portable program;
- the repaired shutdown handler could close the wrong process.
Recommended fix:
- retain the PID returned by Run() wherever possible;
- use process-name tracking only as a documented fallback where the launched
  program intentionally spawns a replacement process.

[ISSUE 10 — HIGH]
— Shutdown process-close loop has no timeout
Origin: [LATENT]
The shutdown loop repeatedly calls ProcessClose() while the process exists.
Impact:
- if the process cannot be terminated, the exit routine can loop indefinitely.
Recommended fix:
- use the tracked PID;
- impose a bounded timeout;
- log failure and continue safe cleanup instead of looping forever.

[ISSUE 7 — HIGH]
— RunWait=false bypasses normal cleanup
Origin: [LATENT]
When RunWait=false, X-Launcher launches the target, resets status, can delete
Temp, and exits before _XClose().
Impact:
- RunAfter is skipped;
- registry restoration is skipped;
- fonts are not removed;
- Temp can be deleted while the target still needs it.
Recommended fix:
- define the intended semantics of RunWait=false;
- if cleanup is required, keep a lightweight watcher alive until the target
  process ends, or explicitly forbid cleanup-dependent functions in this mode.

======================================================================
; PHASE 2 — REGISTRY TRANSACTION SAFETY AND x86/x64 BEHAVIOUR
; These are the highest data-integrity risks.
======================================================================
[ISSUE 3 — CRITICAL]
— _RegEdit() treats reg.exe command failure as success
Origin: [LATENT]
_RunWait/RunWait success is currently interpreted as "the process started",
without checking the actual REG.EXE exit code.
Impact:
- failed import/export can be silently accepted.
Recommended fix:
- treat exit code 0 as success;
- treat non-zero exit code as failure;
- log command, operation, exit code and target file/key.

[ISSUE 2 — CRITICAL]
— Existing registry data can be deleted after backup failure
Origin: [LATENT]
_RegKeyLoad() exports the existing key, then immediately RegDelete()s it, then
imports the portable .reg file without confirming export success.
Impact:
- original host registry data can be lost.
Recommended fix:
- export;
- verify command success AND backup file existence/validity;
- only then delete/replace the host key;
- abort the transaction on any failure.

[ISSUE 4 — CRITICAL]
— Registry backup can be destroyed after restore failure
Origin: [LATENT]
_RegFileRestore() can delete keys, attempt imports and then remove the backup
directory without checking every restore operation.
Impact:
- recovery data can be destroyed after a failed restoration.
Recommended fix:
- never delete backup material until every restore operation is verified;
- leave failed transaction data intact and clearly logged.

[ISSUE 5 — HIGH]
— No explicit 32-bit/64-bit registry-view policy
Origin: [X64/WIN]
CURRENT STATUS AT HANDOFF:
- CURRENT ISSUE.
- Baseline regression test has been created and run.
- Test 08 "Registry 32-bit View" currently FAILS as expected before the fix.
- All earlier regression tests currently PASS.
- NO Issue 5 source fix has been applied yet.
The launcher is now x64. Windows can expose different 32-bit and 64-bit views
of redirected registry areas.
Impact:
- a 64-bit launcher can modify a view that a 32-bit portable application does
  not use, or vice versa.
Recommended fix:
- add a compatible configuration option such as RegView=32 / RegView=64 /
  RegView=Native;
- apply the same view consistently to read, export, delete, import and restore;
- preserve backward compatibility for existing INI files.

[ISSUE 6 — HIGH]
— No robust recovery from interrupted registry transaction
Origin: [LATENT] + [X64/WIN]
A power loss, crash or forced termination can occur after portable registry data
is imported but before original host data is restored.
Impact:
- host registry remains modified;
- a later launch can overwrite useful recovery state with a new backup.
Recommended fix:
- use a transaction marker/manifest;
- preserve original backups until successful restore;
- on next launch detect unfinished work and offer/perform safe recovery before
  importing anything new.

[ISSUE 27 — MEDIUM/HIGH]
— Protected registry operations are not safely handled
Origin: [X64/WIN]
The launcher normally runs without elevation, which is appropriate, but
protected keys can fail.
Impact:
- silent/partial failure if permissions are insufficient.
Recommended fix:
- do not make the whole launcher require admin by default;
- detect access failure and stop the registry transaction safely;
- use an explicitly configured elevated helper only when required.

[ISSUE 24 — MEDIUM/HIGH]
— Multi-root .reg files are not safely backed up
Origin: [LATENT]
_RegKeyGet() returns only the first section/root found, but the entire .reg file
is imported.
Impact:
- additional imported roots may have no matching original-state backup.
Recommended fix:
- parse and enumerate every affected registry root/key, or reject unsupported
  multi-root registry files with a clear error.

[ISSUE 26 — MEDIUM]
— Registry restoration order is not recorded
Origin: [LATENT]
Backup .reg files are restored by directory enumeration rather than a stored
transaction order.
Impact:
- overlapping registry trees could be restored in an unintended order.
Recommended fix:
- write an ordered manifest during backup and restore from that manifest.

[ISSUE 25 — MEDIUM]
— Registry backup filenames can collide
Origin: [LATENT]
Numbers are concatenated without separators, e.g. backup-111.reg can represent
more than one pair of indexes.
Recommended fix:
- use unambiguous names, for example backup-001-011.reg.

[ISSUE 23 — HIGH]
— _WriteToReg() uses INI-writing semantics for .reg data
Origin: [LATENT]
The function creates a .reg-style header/section and then calls IniWrite().
Registry .reg value syntax is not the same as INI syntax.
Impact:
- generated .reg files can be invalid or semantically wrong.
Recommended fix:
- write proper .reg syntax explicitly, or redesign the feature to use safe
  registry operations without generating .reg files this way.

======================================================================
; PHASE 3 — FILE/DIRECTORY DATA SAFETY
======================================================================
[ISSUE 8 — HIGH]
— _DirMove() can delete unmoved source data
Origin: [LATENT]
The extended directory move calls _DirMoveEx(), does not reliably verify that
all data moved, then recursively removes the source.
Impact:
- locked/failed files can be deleted from the source after partial movement.
Recommended fix:
- verify every move;
- never recursively delete the source when any child operation failed;
- add a failure log listing the exact paths left behind.

[ISSUE 18 — MEDIUM]
— _DirCreate() can report failure after success
Origin: [LATENT]
The first DirCreate() result is not stored; the status variable is assigned only
for additional subdirectories.
Recommended fix:
- initialise/store every operation result and aggregate failures correctly.

[ISSUE 19 — MEDIUM]
— _FileDelete() has incorrect/partial result handling
Origin: [LATENT]
The first delete result is not stored, and multi-file processing effectively
checks only the final operation.
Recommended fix:
- check each file individually;
- return failure if any requested delete fails;
- log which file failed.

[ISSUE 20 — MEDIUM]
— _FileCopy() checks only the final copy result
Origin: [LATENT]
An earlier copy may fail and a later copy succeed, producing an apparent
success.
Recommended fix:
- aggregate per-file results and preserve first/complete error information.

[ISSUE 21 — MEDIUM/HIGH]
— FirstRun deliberately ignores most operation errors
Origin: [LATENT]
Error checks for file/directory operations are commented out, yet FirstRun can
still be set to false.
Impact:
- a partial first-run setup can be permanently marked complete.
Recommended fix:
- every required operation must succeed before clearing FirstRun;
- retain FirstRun=true after failure;
- write a concise failure log.

[ISSUE 36 — HIGH]
— Recursive Temp deletion lacks a strong safety guard
Origin: [LATENT]
$Temp is configurable and cleanup uses recursive DirRemove($Temp, 1).
Impact:
- a bad configuration could point Temp at a valuable directory.
Recommended fix:
- refuse to recursively remove:
  * blank paths;
  * drive roots;
  * @ScriptDir;
  * $Root;
  * Windows/System directories;
  * other explicitly protected locations.
- canonicalise and validate the path before deletion.

======================================================================
; PHASE 4 — SPLASH, LANGUAGE, TRAY AND USER-VISIBLE CONFIGURATION
; Low data risk, but several settings currently do not behave as documented.
======================================================================
[ISSUE 12 — DEFINITE]
— Splash fallback uses the wrong variable
Origin: [LATENT]
_SplashScreen() receives $Temp but constructs the fallback image path from
$tempdir.
Impact:
- default splash extraction can fail or use an unintended path.
Recommended fix:
- use the supplied $Temp parameter.

[ISSUE 13 — DEFINITE]
— Splash delays program startup instead of covering it
Origin: [LATENT]
_SplashScreen() displays the image, sleeps for the full timeout, closes it, and
only then does the launcher start the target.
Impact:
- the splash adds artificial startup delay.
Recommended fix:
- display splash without blocking;
- start target immediately;
- close splash after timeout or once an appropriate startup condition occurs.

[ISSUE 14 — DEFINITE]
— Splash Title, Width and Height settings are ignored
Origin: [LATENT]
The settings are read from INI, but the function hard-codes blank title and
307x213 dimensions.
Recommended fix:
- pass through and validate the configured title/size;
- preserve defaults when fields are blank.

[ISSUE 15 — DEFINITE]
— Automatic language result is discarded
Origin: [LATENT]
_SystemLanguage($Lang) returns a value, but the caller does not assign it.
Recommended fix:
    $Lang = _SystemLanguage($Lang)

[ISSUE 16 — DEFINITE]
— TrayTip TimeOut key has a trailing-space typo
Origin: [LATENT]
Source reads "TimeOut " while the INI uses "Timeout".
Recommended fix:
- read the correct key;
- optionally accept the old typo as a compatibility fallback if any existing
  INIs might contain it.

[ISSUE 17 — MEDIUM]
— TrayTip also hard-codes 3 seconds
Origin: [LATENT]
The configured timeout controls the Adlib callback, while TrayTip() itself is
called with 3 seconds.
Recommended fix:
- make the two timeout mechanisms consistent;
- confirm AutoIt timeout units and intended behaviour in the new baseline.

======================================================================
; PHASE 5 — CONFIG PARSING, TEXT REWRITING, COMMAND LINES AND PATHS
======================================================================
[ISSUE 22 — DEFINITE]
— StringRegExp replacement Counter option is broken
Origin: [LATENT]
StringSplit() produces a string, but the code uses IsInt() to test it.
Recommended fix:
- use StringIsInt() and convert to Number/Int after validation.

[ISSUE 28 — HIGH]
— Command-line quoting is fragile
Origin: [LATENT] + [X64/WIN]
Arguments beginning with - or / are handled differently from other parameters,
and HideShellWindow=true sends the resulting string through cmd.exe /c.
Impact:
- spaces and shell metacharacters (& | % ^ etc.) can be interpreted wrongly.
Recommended fix:
- separate executable path from argument construction;
- avoid cmd.exe for EXE targets where possible;
- use a dedicated, tested quoting function;
- maintain a specific path for .bat/.cmd payloads.

[ISSUE 29 — MEDIUM/HIGH]
— Text-rewrite functions may alter encoding/EOL format
Origin: [MIXED]
Several functions read and rewrite whole files line-by-line. AutoIt changed
default text-file encoding behaviour in v3.3.14.0.
Impact:
- application configuration files can change encoding, BOM, EOL style or
  trailing blank lines even when only one value was intended to change.
Recommended fix:
- detect and preserve original encoding and line endings;
- avoid unnecessary full-file rewrites.

[ISSUE 30 — MEDIUM]
— _MozPrefs() matches preference names too broadly
Origin: [LATENT]
It looks for the preference text anywhere on a line.
Impact:
- similarly named preferences or comments can be replaced.
Recommended fix:
- match exact pref("name"...)/user_pref("name"...) syntax.

[ISSUE 31 — MEDIUM]
— _ExpandMultiPath() handles relative paths inconsistently
Origin: [LATENT]
Wildcard paths go through _FullPath(), ordinary paths may be returned unchanged.
Impact:
- result depends on current working directory.
Recommended fix:
- normalise every input path using the same base rules.

[ISSUE 32 — MEDIUM]
— UNC/network paths are not consistently preserved
Origin: [LATENT]
_NormalPath() collapses repeated backslashes; some callers run paths through it
after _FullPath() has performed its UNC test.
Impact:
- \\server\share paths can be corrupted in some code paths.
Recommended fix:
- make UNC detection/normalisation explicit and test it separately.

[ISSUE 33 — MEDIUM]
— _FixDriveLetter() has an array edge case and broad matching
Origin: [LATENT]
Its replacement array can overflow in unusual non-drive-root conditions, and it
blindly rewrites drive-like text in arbitrary files.
Recommended fix:
- correct array sizing/indexing;
- validate that $Root is a drive path before drive-letter replacement;
- narrow the replacement rules where possible.

[ISSUE 34 — HIGH WHEN ENABLED]
— _FixUserProfile() has an unsafe empty-old-value case
Origin: [LATENT]
If the saved old directory name is blank, the code can construct a move from the
profile root.
Recommended fix:
- never call DirMove unless $old is non-empty, a simple child-directory name,
  and the source resolves inside the intended profile directory.

[ISSUE 35 — MEDIUM]
— _FullPath() exits the entire launcher on excessive ".."
Origin: [LATENT]
A path calculation error calls Exit(10).
Impact:
- abrupt termination can bypass expected cleanup.
Recommended fix:
- return SetError() instead;
- let the caller decide whether to stop;
- ensure cleanup runs on fatal configuration errors.

======================================================================
; PHASE 6 — OPTIONAL JAVA SUBSYSTEM
; Current default Java=false. Keep it disabled until this phase is addressed.
======================================================================
[ISSUE 37 — HIGH]
— Java download-completion loop is reversed
Origin: [AUTOIT]/[LATENT]
InetGetInfo(handle, 2) indicates that an asynchronous download is complete.
The code loops while that value is true rather than while the download is still
active.
Recommended fix:
- rewrite using documented asynchronous InetGet/InetGetInfo behaviour;
- include download error and size verification.

[ISSUE 38 — HIGH]
— Java fatal-error function returns to the failing procedure
Origin: [LATENT]
_Error_Msg() restores backup and calls _CloseJG(), but _CloseJG() only returns
a value. Execution can continue after the supposed fatal error.
Recommended fix:
- propagate a fatal return value through every caller or explicitly abort the
  Java transaction in one controlled place.

[ISSUE 39 — HIGH]
— Java tray "Exit" does not actually exit JavaGet
Origin: [LATENT]
_ExitJG() restores backup and returns, but does not stop the Java routine.
Recommended fix:
- implement a real cancellation state/controlled exit.

[ISSUE 40 — HIGH]
— _JavaCheck() ignores _JavaGet() result
Origin: [LATENT]
The selection logic continues regardless of success, failure or cancellation.
Recommended fix:
- define explicit return codes and honour them.

[ISSUE 41 — MEDIUM]
— Java version strings are compared with normal operators
Origin: [LATENT]
Multi-part version strings should not be compared as simple strings/numbers.
Recommended fix:
- use AutoIt's _VersionCompare().

[ISSUE 42 — HIGH/OBSOLETE]
— Java installer targets an old Java architecture
Origin: [JAVA]
The subsystem references unpack200.exe, old browser plugin DLLs, old setup
extraction behaviour and the legacy JavaSoft JRE registry layout.
Recommended fix:
- do not attempt piecemeal repair until a current Java-support requirement is
  defined;
- if Java installation is no longer required, remove/retire this subsystem;
- if required, redesign it around the exact Java distributions X-Launcher is
  intended to support.

======================================================================
; LOWER-PRIORITY CLEANUP / COMPATIBILITY NOTES
======================================================================

A. SendMessageTimeout x64 types
The DllCall types can be modernised for strict pointer-sized correctness.
Current use is not considered a likely functional failure because the relevant
message parameters are zero and the function return value is ignored.

B. MultipleIstances spelling
"MultipleIstances" is misspelled, but source and INI agree, so it works.
Do NOT simply rename it. If corrected, support both:
  MultipleIstances=...
  MultipleInstances=...
with the correctly spelled name taking precedence.

C. image_get_size.au3
This appears to be legacy/unused by current launcher execution. Leave it alone
until a real dependency is identified.

======================================================================
; WHAT CAUSED THESE PROBLEMS?
======================================================================

1. AutoIt evolution
The source itself labels major helper modules as AutoIt Version 3.2.12.1.
AutoIt changed substantially after that era.

The clearest confirmed example is Issue 1:
- OnAutoItExit() was deprecated and then removed as an automatic mechanism;
- modern AutoIt requires OnAutoItExitRegister().

AutoIt also changed default text-file encoding behaviour in later releases,
which makes the old whole-file rewrite functions more risky than they were in
the original era.

2. Moving from x86 to x64
Issue 5 is primarily a consequence of compiling the launcher as 64-bit.
The Windows WOW64 registry model has separate 32-bit/64-bit views for relevant
keys. A universal launcher must deliberately choose the view appropriate to the
portable application instead of inheriting the launcher's own bitness.

3. Modern Windows security/behaviour
UAC/elevation, protected registry keys, modern process behaviour and modern
Windows versions expose assumptions that old portable-launcher code could get
away with on earlier systems.

4. Old latent bugs
Most of the list is NOT caused by a new AutoIt version or by Windows.
Examples include:
- ignoring return codes;
- deleting a source directory after a partial move;
- checking only the last item in a multi-file operation;
- the splash $tempdir typo;
- the TrayTip key typo;
- unsafe cleanup after failed registry export;
- weak command-line quoting.

Those bugs were already present. They simply may not have been triggered during
normal "happy path" use.

5. External software evolution
The Java subsystem is obsolete mainly because Java packaging and deployment
changed drastically. An older AutoIt compiler would not make the old Java
installer appropriate for current Java.

======================================================================
; WOULD THE OLD AUTOIT COMPILER MAKE IT "WORK FINE"?
======================================================================

It would make SOME historical behaviour match the original source.

For example, an AutoIt version old enough to support automatic OnAutoItExit()
would make that particular handler work as originally intended.

However, an old compiler would NOT repair the latent safety defects listed
above. Registry error handling, partial directory moves, ignored copy/delete
failures, command quoting, splash mistakes and similar bugs would still exist.

Therefore the preferred strategy is:
- use a supported modern AutoIt;
- deliberately update the old assumptions;
- preserve X-Launcher's existing INI compatibility wherever possible;
- validate every repair with controlled regression tests.

