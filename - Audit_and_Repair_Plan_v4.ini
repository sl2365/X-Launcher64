it is EXTERNAL test material. It is not part of the X-Launcher application
source and must not be compiled into X-Launcher.

Current structure:

Test_Suite\
    RUN_TEST.bat
    README.txt
    Configs\
    Working\
    Results.log
    X-Launcher_x64.exe    <- copied here automatically by BUILD_TEST.bat

There is ONE RUN_TEST.bat for the whole suite.

Every completed regression test remains in this same suite. New tests are
added to it as repairs progress. Tests run SEQUENTIALLY so one test cannot
interfere with another, but the user still performs the entire regression run
with one action.

BUILD AND TEST WORKFLOW

The project root contains:
    BUILD_TEST.bat

The normal user action is:
    double-click BUILD_TEST.bat

BUILD_TEST.bat must:
1. run AU3Check using AutoIt v3.3.18.0;
2. stop if AU3Check fails;
3. compile X-Launcher;
4. stop if compilation fails;
5. move/copy the compiled X-Launcher_x64.exe into Test_Suite;
6. call Test_Suite\RUN_TEST.bat /nopause;
7. leave the final Command Prompt visible so the user can read the result.

RUN_TEST.bat must:
1. prepare only disposable test data;
2. run every regression test sequentially;
3. print a bullet-style PASS/FAIL summary in the Command Prompt;
4. write the same summary to Results.log;
5. return failure if any regression test fails.

Do not make the user run separate test batch files.

Do not create a new top-level test suite for each audit issue.

Do not put regression-test code into the X-Launcher source or compiled EXE.

TEST SAFETY RULES

1. Never depend on a real installed portable application.
2. Never modify real application data.
3. Registry tests must use disposable HKCU test data only.
4. Existing registry tests use:
       HKCU\Software\XLauncher_Test
   or an explicitly disposable child key under a redirected HKCU branch when
   a 32-bit/64-bit registry-view test requires it.
5. Destructive filesystem tests must operate only under Test_Suite\Working.
6. Tests must be repeatable and clean up their disposable data.
7. A test must create observable evidence, not rely only on visual behaviour.
8. If a new baseline test does not fail for the expected reason, FIX THE TEST
   FIRST. Do not change X-Launcher source merely to make a faulty test pass.
9. Previously completed regression tests must remain PASS after every repair.
10. Some true Windows lifecycle events, such as real logoff/shutdown, may need
    a later manual test rather than a fake automated PASS.

