NON-NEGOTIABLE WORKING RULES

- Work on ONE audit issue at a time.
- Make the smallest reliable change that fixes that issue.
- Preserve X-Launcher's existing intended behaviour and INI compatibility.
- Do not redesign features merely because a newer design seems cleaner.
- Before changing behaviour that might be intentional, inspect the source and,
  where useful, historical documentation/manual behaviour.
- Never silently remove a capability in order to make a regression test pass.
- If a proposed fix changes behaviour outside the current issue, stop and
  reassess before applying it.
- Inspect the CURRENT uploaded source before editing it.
- Never invent paths, functions, dependencies, commands, or source structure.
- Do not ask the user to use command-line navigation or developer tooling.
- Instructions are for a non-programmer using CudaText and BUILD_TEST.bat.
- Keep instructions concise.

EXACT EDIT-INSTRUCTION FORMAT

For an existing file:

Open: filename.ext

Find this exact block:

    [exact current code]

Replace with this exact block:

    [complete replacement code]

For a new file:

Create: filename.ext
In folder: path relative to Project Root
Paste this entire file:

    [complete file contents]

Use project-relative paths unless an absolute path is genuinely necessary.

Do not give vague instructions such as:
    "edit the function"
    "change the line around..."
    "from the project root, run..."

TEST-FIRST REPAIR CYCLE

For every issue where an automated regression test is practical:

STEP A — Establish the baseline
1. Add the new test to the existing external Test_Suite.
2. Keep all completed tests in RUN_TEST.bat.
3. Give the user the updated Test_Suite as a ZIP.
4. The user replaces/copies those files into the existing Test_Suite.
5. The user double-clicks BUILD_TEST.bat.
6. Verify:
   - AU3Check PASS;
   - Build PASS;
   - all previously completed tests PASS;
   - the new test FAILS for the intended defect.

If the result is blank, unexpected, or fails for the wrong reason:
    DO NOT CHANGE SOURCE.
Fix the regression test first and rerun the baseline.

STEP B — Apply the source repair
1. Inspect the exact current source involved.
2. Identify every file that must change before giving edit instructions.
3. Give only the smallest coordinated edit needed for the current issue.
4. Explain any important compatibility/behaviour risk briefly.
5. Do not bundle unrelated cleanup or refactoring.

STEP C — Validate
1. User saves the edited files.
2. User double-clicks BUILD_TEST.bat.
3. Require:
   - AU3Check: PASS with no new warnings;
   - Build: PASS;
   - the new regression test: PASS;
   - every previous regression test: PASS.

STEP D — Close the issue
Only after all required tests pass:
1. state that the issue is complete;
2. tell the user they can comment out that issue section in this Audit file;
3. state the next issue;
4. add the next regression test before changing that next issue.

DO NOT mark an issue complete merely because the code compiles.

DO NOT move to the next issue while its new regression test is still failing.

