======================================================================
; PROPOSED TEST-HARNESS RULES
======================================================================

Every issue should get an isolated repeatable test where practical.

1. Tests may only alter:
   - a dedicated Tests\Working folder;
   - the launcher Temp folder created for that test;
   - HKCU\Software\XLauncher_Test;
   - files created specifically by the test.

2. Every RUN_TEST.bat should:
   - clean its previous test area;
   - write TEST START time;
   - record AutoIt/X-Launcher version where possible;
   - launch X-Launcher with the test-specific INI;
   - capture X-Launcher's process exit code if practical;
   - run post-test verification;
   - write PASS or FAIL plus evidence to Results\test.log.

3. The payload should never rely only on visual behaviour.
Create observable evidence:
   - marker files;
   - logged environment values;
   - recorded arguments;
   - expected registry values;
   - expected file/folder contents;
   - timestamps;
   - controlled exit codes.

4. For registry tests:
   - use HKCU only;
   - use HKCU\Software\XLauncher_Test;
   - export a before snapshot;
   - verify the exact expected state while the payload runs;
   - verify the original state after X-Launcher closes.

5. For destructive file-operation tests:
   - generate disposable files during RUN_TEST.bat;
   - include deliberate locked/missing/read-only cases;
   - verify that a failed operation NEVER deletes the only surviving copy.

6. For process tests:
   - use a tiny dedicated test executable so X-Launcher has a real PID to track;
   - use batch files around it to prepare the test and verify the result.

7. Do not move to the next defect until:
   - source compiles without new warnings;
   - the new test passes;
   - previously completed regression tests still pass.

