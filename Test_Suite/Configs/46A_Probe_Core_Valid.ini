[Setup]
AppName=X-Launcher Configuration Probe Core Valid Test
Lang=en

[FileSystem]
Root=..\Root
Temp=.\Temp
Cache=.\Cache
Home=.\Home
Bin=.\Bin
Lib=.\Lib
Doc=.\Documents
Backup=.\Backups
Download=.\Downloads

[FileToRun]
PathToExe=.\Payload.bat
Parameters=--would-run
WorkingDir=.
WinGetProcess=

[Options]
DeleteTemp=false
MultipleInstances=true
FixAppData=false
RunWait=true
ShowSplash=false
ShowTrayTip=false
WriteLog=false
HideShellWindow=true
FirstRun=false
Java=true
JavaURL=https://example.invalid/java-runtime.zip
Debug=false
RegView=Native
TestRun=false
ProcMonMaxMB=2048
ProcMonReserveMB=1024

[Environment]
PROBE_TEST_VAR=SHOULD_NOT_BE_APPLIED
USERPROFILE=.\PortableProfile
PATH=%PATH%;.\Tools

[Functions]
DirCopy=.\SourceDir|.\CopiedDir
DirCreate=.\WouldCreateDir
DirMove=.\MoveSourceDir|.\MovedDir
DirRemove=.\RemoveMe
FileCopy=.\Source.txt|.\Copied.txt
FileCreate=.\WouldCreate.txt
FileDelete=.\DeleteMe.txt
FileMove=.\MoveMe.txt|.\Moved.txt
AddFonts=.\DummyFont.ttf

[FirstRunOperations]
FileCreate=.\FirstRunWouldCreate.txt
RunFile=.\OperationPayload.bat

[RunBefore]
FixDriveLetter=.\RewriteTarget.txt
Regedit=.\Portable.reg|*
RunFile=.\OperationPayload.bat

[RunAfter]
FileDelete=.\DeleteMe.txt
RunFile=.\OperationPayload.bat

[StringReplace=.\DynamicWildcard*.txt]
BEGIN|END=PROBE_REPLACEMENT

[StringRegExpReplace=.\DynamicRegex.txt]
~|1=old~new

[WriteToFile=.\DynamicWrite.txt]
Line1=PROBE_LINE
EOF=PROBE_EOF

[WriteToIni=.\DynamicWrite.ini]
Probe|State=WOULD_WRITE

[WriteToPref=.\DynamicPrefs.js]
Format=user_pref("[PREF]", [VALUE]);
probe.preference=true

[WriteToReg=.\DynamicGenerated.reg]
MainKey=HKEY_CURRENT_USER\Software\XLauncher_Test\Probe46Generated
RootValue=ROOT_DATA
Child|ChildValue=CHILD_DATA
