[Setup]
AppName=X-Launcher RunAfter Stop-On-Failure Test
Lang=en

[FileSystem]
Root=..\Root
Temp=.\Temp
Download=.\Downloads

[FileToRun]
PathToExe=.\Payload.bat
Parameters=
WorkingDir=.
WinGetProcess=

[Options]
DeleteTemp=true
MultipleInstances=true
FixAppData=false
RunWait=true
RunAfterStopOnFailure=true
ShowSplash=false
ShowTrayTip=false
WriteLog=false
HideShellWindow=true
FirstRun=false
Java=false
Debug=true
RegView=Native
TestRun=false

[RunBefore]
Regedit=.\Portable.reg

[RunAfter]
FileMove=.\Temp\OptionalUpdate-*.exe|.\Downloads\|o
RunFile=.\AfterSkip.bat
FileMove=.\Temp\Required.exe|.\Downloads\Required.exe|o
RunFile=.\Blocked.bat
