;=================================================
; ** X-Launcher's configuration file **
;=================================================

[Setup]
AppName=MyApp
; AppVer=
; UserName=User
; Profile=Default
; Lang=%LANG%

;-------------------------------------------------
; [FileSystem]
; Root=@ScriptDir@
; Temp=@TempDir@\$ScriptName$
; Cache=@TempDir@\$ScriptName$\Cache
; Home=.\$UserName$
; Bin=.\Bin
; Lib=.\Lib
; Doc=.\Documents
; Backup=.\Backups
; Download=.\Downloads

;-------------------------------------------------
; ** Path syntax **
;-------------------------------------------------
; ALL RELATIVE PATHS ARE RELATIVE TO "Root" (and "Root" is relative to "@ScriptDir@")

; \Path --> path relative to root drive
; .\Path --> path relative to root
; ..\Path --> path relative to one level up
; ..\..\Path --> up two leves, and go on
; X:\Path -> absolute path

;-------------------------------------------------
[FileToRun]
PathToExe=$Bin$\$AppName$\$AppName$.exe
; *** for Java software use: 
; PathToExe=$Java$\bin\javaw.exe
Parameters=
WorkingDir=
WinGetProcess=

;-------------------------------------------------
[Options]
DeleteTemp=true
; *** corrected spelling; replace the misspelled setting used by older releases
MultipleInstances=true
FixAppData=false
; *** redirects LOCALAPPDATA to $Lib$\AppData\Local and creates that directory
FixLocalAppData=false
; *** redirects both TEMP and TMP to $Lib$\AppData\Local\Temp and creates it
; *** this does not delete that folder; use [RunAfter] DirRemove if cleanup is wanted
; *** explicit values in [Environment] are processed afterwards and take priority
FixTemp=false
RunWait=true
; *** false keeps the historical behavior and continues later [RunAfter] entries
; *** true stops later configured entries after a genuine [RunAfter] failure
; *** mandatory registry, font, Temp and Trace cleanup still completes
RunAfterStopOnFailure=false
ShowSplash=true
ShowTrayTip=true
WriteLog=false
HideShellWindow=true
; *** registry view for redirected keys: Auto, Native, 32 or 64
RegView=Auto
; *** to execute [FirstRunOperations] section (only at the very first run)
FirstRun=false
; *** Java policy: false (off), true (required), or optional
Java=false
; *** optional existing Java runtime root, bin folder, java.exe or javaw.exe
; *** absolute or Root-relative; used read-only before other Java sources
; *** requires both java.exe and javaw.exe; do not use JavaPortableLauncher.exe
JavaPath=
; *** optional direct HTTP or HTTPS Java package download fallback (not a local path)
JavaURL=
; *** normal application diagnostic logging; also enables WriteLog
Debug=true
; *** built-in diagnostic mode: false, Probe (read-only), Trace (runs app), or Full (isolated)
; *** non-false modes ask for confirmation and write reports below .\Diagnostics
TestRun=false
; *** optional Process Monitor executable or folder used by Application Trace
; *** absolute or Root-relative; blank tries $Lib$\Tools\ProcessMonitor\Procmon64.exe
; *** with Process Monitor, Trace also creates Application_Portability_Report.txt
; *** review UNMANAGED entries; MANAGED entries match current INI paths or REG roots
ProcMonPath=
; *** optional Application Trace PML safety limits in megabytes
; *** ranges/defaults: maximum 64-102400/512 MB; reserve 256-102400/1024 MB
ProcMonMaxMB=512
ProcMonReserveMB=1024

;-------------------------------------------------
[SplashScreen]
Image=
Title=
TimeOut=1500
Width=
Height=

;-------------------------------------------------
[TrayTip]
Title=
Timeout=5000

;-------------------------------------------------
[Environment]
; HOME=$Home$\$AppName$
; PATH=%PATH%;@ScriptDir@
; LANG=$Lang$
; USERPROFILE=%HOME%
; MY_VAR=MY_VALUE|(Options) = Or ~%20\\/"

;-------------------------------------------------
; ** String transformation **
;-------------------------------------------------
; = --> returns the original string (not interpreted as path)
; ~ --> returns the 8.3 short path+name of the string passed
; %20 --> replaces blanck spaces with '%20'
; \\ --> replaces '\' with '\\'
; / --> replaces '\' with '/'
; " --> returns the string enclosed between apexes: "String"
;-------------------------------------------------

[Functions]
; DirCopy=(Source)Path|(Destination)Path|(Option) o
; DirCreate=Path1\SubPath1;SubPath2|Path2|Path3\SubPath3
; DirMove=(Source)Path|(Destination)NewPath|(Option) o
; DirRemove=Path|(Option) e
; FileCopy=(Source)Path\file1;file2;file3|(Destination)Path\|(Option) o
; FileCopy=(Source)Path\file|(Destination)Path\(Or)File|(Option) o
; FileDelete=Path1\file1;file2|Path2\file3
; FileCreate=Path1\file1;file2|Path2\file3
; FileMove=(Source)Path\File|(Destination) NewPath\NewFile|(Option) o
; AddFonts=Path\File.Ext ("*" wildcard allowed)
; Junctions=(Existing directory)|(New junction path)|(Optional) *
; SymLinks=(Existing file or directory)|(New symbolic-link path)|(Optional) *

; o --> overwrite mode
; e --> remove if empty
; * --> keep this junction or symbolic link after the application exits
;       Without *, the launcher removes only the link it created. Do not add a trailing pipe.
;       Existing destinations are never overwritten. Symbolic links may require
;       Windows Developer Mode or starting X-Launcher with Run as administrator.

;-------------------------------------------------
[FirstRunOperations]
