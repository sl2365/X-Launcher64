; DirMove=(Source)Path|(Destination)NewPath|(Option) o
; DirRemove=Path|(Option) e
; FileCopy=(Source)Path\file1;file2;file3|(Destination)Path\|(Option) o
; FileCopy=(Source)Path\file|(Destination)Path\(Or)File|(Option) o
; FileDelete=Path1\file1;file2|Path2\file3
; FileCreate=Path1\file1;file2|Path2\file3
; FileMove=(Source)Path\File|(Destination) NewPath\NewFile|(Option) o
; RunFile=Path\File|Parameters

; o --> overwrite mode
; e --> remove if empty

